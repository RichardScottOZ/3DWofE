[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threedwofe"
version = "1.0.0"
description = "Three-dimensional Weights of Evidence for mineral prospectivity modeling"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "Ehsan Farahbakhsh"},
    {name = "Richard Scott", email = "richard.scott@example.com"}
]
keywords = ["geology", "mineral prospectivity", "weights of evidence", "3D modeling", "geoscience"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=4.0",
]

[project.scripts]
threedwofe = "threedwofe.cli:main"

[project.urls]
Homepage = "https://github.com/RichardScottOZ/3DWofE"
Repository = "https://github.com/RichardScottOZ/3DWofE"
Documentation = "https://github.com/RichardScottOZ/3DWofE/blob/master/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
